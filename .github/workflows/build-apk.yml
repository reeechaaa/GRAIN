name: Build GRAIN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract GRAIN project
        run: unzip -q GRAIN-Android-project.zip -d project

      - name: Build APK
        working-directory: project/GRAIN-Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAIN-APK
          path: project/GRAIN-Android/app/build/outputs/apk/debug/app-debug.apk
